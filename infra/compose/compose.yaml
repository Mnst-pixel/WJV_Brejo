name: kairos

x-service-defaults: &service-defaults
  restart: unless-stopped
  init: true
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

services:
  edge:
    <<: *service-defaults
    image: caddy:2.11.4-alpine
    ports:
      - "${KAIROS_BIND_ADDRESS:-0.0.0.0}:${KAIROS_PUBLIC_PORT:-4080}:80"
    volumes:
      - ../caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - kairos_caddy_data:/data
      - kairos_caddy_config:/config
    networks:
      - edge
      - app
    depends_on:
      wordpress:
        condition: service_healthy
      web:
        condition: service_healthy
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
    mem_limit: 192m
    cpus: 0.35
    pids_limit: 128

  web:
    <<: *service-defaults
    build:
      context: ../../apps/web
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      INTERNAL_API_URL: http://api:8000
      NEXT_PUBLIC_BASE_PATH: /app
    networks:
      - app
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/app/api/health"]
      interval: 15s
      timeout: 5s
      retries: 8
    mem_limit: 512m
    cpus: 0.75
    pids_limit: 256

  api:
    <<: *service-defaults
    build:
      context: ../../apps/api
      dockerfile: Dockerfile
    command: ["api"]
    env_file:
      - /opt/kairos/secrets/.env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      S3_ENDPOINT_URL: http://minio:9000
      S3_BUCKET_NAME: documents
      CLAMAV_HOST: clamav
      CLAMAV_PORT: "3310"
      HERMES_BASE_URL: http://hermes:8642
      MCP_GATEWAY_URL: http://mcp-gateway:3000
    networks:
      - app
      - data
      - ai
      - mcp
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/live', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 8
    mem_limit: 768m
    cpus: 1.0
    pids_limit: 256

  worker:
    <<: *service-defaults
    build:
      context: ../../apps/api
      dockerfile: Dockerfile
    command: ["worker"]
    env_file:
      - /opt/kairos/secrets/.env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      S3_ENDPOINT_URL: http://minio:9000
      S3_BUCKET_NAME: documents
      CLAMAV_HOST: clamav
      CLAMAV_PORT: "3310"
      HERMES_BASE_URL: http://hermes:8642
      MCP_GATEWAY_URL: http://mcp-gateway:3000
    networks:
      - data
      - ai
      - mcp
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      clamav:
        condition: service_healthy
    mem_limit: 768m
    cpus: 1.0
    pids_limit: 256

  localai:
    <<: *service-defaults
    image: localai/localai:v4.9.0
    env_file:
      - /opt/kairos/secrets/.env
    environment:
      LOCALAI_MODELS_PATH: /models
      LOCALAI_BACKENDS_PATH: /backends
      LOCALAI_DATA_PATH: /data
      LOCALAI_DISABLE_WEBUI: "true"
      LOCALAI_SUBTLE_KEY_COMPARISON: "true"
      LOCALAI_LOG_LEVEL: info
    volumes:
      - kairos_localai_models:/models
      - kairos_localai_backends:/backends
      - kairos_localai_data:/data
    networks:
      - ai
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -H \"Authorization: Bearer $$LOCALAI_API_KEY\" http://127.0.0.1:8080/readyz >/dev/null"]
      start_period: 10m
      interval: 30s
      timeout: 15s
      retries: 20
    mem_limit: 3g
    cpus: 3.0
    pids_limit: 512

  hermes-bootstrap:
    image: nousresearch/hermes-agent:v2026.8.19
    restart: "no"
    init: true
    user: "10000:10000"
    security_opt:
      - no-new-privileges:true
    env_file:
      - /opt/kairos/secrets/.env
    entrypoint: ["/opt/hermes/.venv/bin/python", "/bootstrap/bootstrap-hermes-config.py"]
    volumes:
      - kairos_hermes_data:/opt/data
      - ../../scripts/bootstrap-hermes-config.py:/bootstrap/bootstrap-hermes-config.py:ro
      - ../../config/hermes/config.template.yaml:/bootstrap/config.template.yaml:ro
      - ../../config/hermes/SOUL.md:/bootstrap/SOUL.md:ro
    mem_limit: 256m
    cpus: 0.25
    pids_limit: 64

  hermes:
    <<: *service-defaults
    image: nousresearch/hermes-agent:v2026.8.19
    command: ["gateway", "run"]
    env_file:
      - /opt/kairos/secrets/.env
    environment:
      HERMES_UID: "10000"
      HERMES_GID: "10000"
      API_SERVER_ENABLED: "true"
      API_SERVER_HOST: 0.0.0.0
      API_SERVER_PORT: "8642"
      API_SERVER_KEY: ${HERMES_BEARER_TOKEN}
      API_SERVER_MODEL_NAME: qwen3-1.7b-kairos
      API_SERVER_CORS_ORIGINS: ${KAIROS_BASE_URL}
      GATEWAY_ALLOW_ALL_USERS: "false"
      HERMES_DASHBOARD: "0"
    volumes:
      - kairos_hermes_data:/opt/data
    networks:
      - ai
      - mcp
    depends_on:
      hermes-bootstrap:
        condition: service_completed_successfully
      localai:
        condition: service_healthy
      mcp-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -H \"Authorization: Bearer $$API_SERVER_KEY\" http://127.0.0.1:8642/health >/dev/null"]
      start_period: 90s
      interval: 20s
      timeout: 10s
      retries: 12
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 384

  mcp-brasil:
    <<: *service-defaults
    build:
      context: ../../services/jurisprudencio
      dockerfile: mcp-brasil.Dockerfile
    env_file:
      - /opt/kairos/secrets/.env
    environment:
      MCP_BRASIL_TOOL_SEARCH: none
      MCP_BRASIL_HTTP_TIMEOUT: "30.0"
      MCP_BRASIL_HTTP_MAX_RETRIES: "3"
      MCP_BRASIL_DATASET_REFRESH: auto
      MCP_BRASIL_DATASET_CACHE_DIR: /cache
    volumes:
      - kairos_mcp_brasil_cache:/cache
    networks:
      - app
      - mcp
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null -X POST http://127.0.0.1:8000/mcp/ -H 'Content-Type: application/json' -H 'Accept: application/json, text/event-stream' -d '{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"initialize\",\"params\":{\"protocolVersion\":\"2025-06-18\",\"capabilities\":{},\"clientInfo\":{\"name\":\"healthcheck\",\"version\":\"1\"}}}'"]
      start_period: 60s
      interval: 30s
      timeout: 15s
      retries: 8
    cap_drop:
      - ALL
    mem_limit: 768m
    cpus: 0.75
    pids_limit: 192

  mcp-gateway:
    <<: *service-defaults
    build:
      context: ../../services/jurisprudencio
      dockerfile: gateway.Dockerfile
    env_file:
      - /opt/kairos/secrets/.env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3000"
      PUBLIC_BASE_URL: http://mcp-gateway:3000
      CORS_ORIGIN: ${KAIROS_BASE_URL}
      DATAJUD_BASE_URL: https://api-publica.datajud.cnj.jus.br
      MCP_BRASIL_ENABLED: "true"
      MCP_BRASIL_URL: http://mcp-brasil:8000/mcp
      MCP_BRASIL_TIMEOUT_MS: "60000"
      CACHE_ENABLED: "true"
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      REDIS_DB: "3"
      CACHE_PREFIX: "kairos:mcp:"
      RATE_LIMIT_PER_MIN: "120"
      QUERIDO_DIARIO_ENABLED: "true"
      INLABS_ENABLED: ${INLABS_ENABLED:-false}
    networks:
      - app
      - data
      - mcp
    depends_on:
      redis:
        condition: service_healthy
      mcp-brasil:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/health"]
      interval: 20s
      timeout: 10s
      retries: 8
    cap_drop:
      - ALL
    mem_limit: 384m
    cpus: 0.5
    pids_limit: 192

  mcp-server:
    <<: *service-defaults
    build:
      context: ../../services/jurisprudencio
      dockerfile: mcp-server.Dockerfile
    env_file:
      - /opt/kairos/secrets/.env
    environment:
      MCP_HOST: 0.0.0.0
      MCP_PORT: "3002"
      GATEWAY_BASE_URL: http://mcp-gateway:3000
      MCP_REQUEST_TIMEOUT_MS: "60000"
    networks:
      - mcp
    depends_on:
      mcp-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider --header=\"Authorization: Bearer $$MCP_API_KEY\" http://127.0.0.1:3002/mcp/health"]
      interval: 20s
      timeout: 10s
      retries: 8
    cap_drop:
      - ALL
    mem_limit: 256m
    cpus: 0.35
    pids_limit: 128

  postgres:
    <<: *service-defaults
    image: pgvector/pgvector:0.8.6-pg17-trixie
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    volumes:
      - kairos_postgres_data:/var/lib/postgresql/data
      - ../../database/postgres/init.sql:/docker-entrypoint-initdb.d/10-kairos.sql:ro
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 256

  redis:
    <<: *service-defaults
    image: redis:8.8.0-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command: ["/bin/sh", "-c", "exec redis-server --appendonly yes --save 60 1000 --requirepass \"$$REDIS_PASSWORD\""]
    volumes:
      - kairos_redis_data:/data
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 384m
    cpus: 0.5
    pids_limit: 128

  minio:
    <<: *service-defaults
    build:
      context: ../minio
      dockerfile: Dockerfile
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BROWSER: "off"
    volumes:
      - kairos_minio_data:/data
    networks:
      - data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 512m
    cpus: 0.75
    pids_limit: 256

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    restart: "no"
    init: true
    security_opt:
      - no-new-privileges:true
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_APP_USER: ${MINIO_APP_USER}
      MINIO_APP_PASSWORD: ${MINIO_APP_PASSWORD}
    volumes:
      - ../minio/documents-policy.json:/policy.json:ro
      - ../minio/bootstrap.sh:/bootstrap.sh:ro
    entrypoint: ["/bin/sh", "/bootstrap.sh"]
    networks:
      - data
    mem_limit: 128m
    cpus: 0.25
    pids_limit: 64

  mariadb:
    <<: *service-defaults
    image: mariadb:12.3.3
    environment:
      MARIADB_DATABASE: ${MARIADB_DATABASE}
      MARIADB_USER: ${MARIADB_USER}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
    volumes:
      - kairos_mariadb_data:/var/lib/mysql
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "healthcheck.sh --connect --innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 15
    mem_limit: 640m
    cpus: 0.75
    pids_limit: 256

  wordpress:
    <<: *service-defaults
    image: wordpress:7.1.0-php8.3-apache
    environment:
      WORDPRESS_DB_HOST: mariadb:3306
      WORDPRESS_DB_NAME: ${MARIADB_DATABASE}
      WORDPRESS_DB_USER: ${MARIADB_USER}
      WORDPRESS_DB_PASSWORD: ${MARIADB_PASSWORD}
      WORDPRESS_CONFIG_EXTRA: |
        define('DISALLOW_FILE_EDIT', true);
        define('WP_AUTO_UPDATE_CORE', false);
        define('FORCE_SSL_ADMIN', false);
    volumes:
      - kairos_wordpress_data:/var/www/html
    networks:
      - app
      - data
    depends_on:
      mariadb:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php -r '$$c=@fsockopen(\"127.0.0.1\",80,$$e,$$s,2); exit($$c?0:1);'"]
      interval: 15s
      timeout: 5s
      retries: 15
    mem_limit: 768m
    cpus: 0.75
    pids_limit: 256

  wordpress-bootstrap:
    image: wordpress:cli-2.12.0-php8.3
    restart: "no"
    init: true
    user: "33:33"
    security_opt:
      - no-new-privileges:true
    environment:
      WORDPRESS_DB_HOST: mariadb:3306
      WORDPRESS_DB_NAME: ${MARIADB_DATABASE}
      WORDPRESS_DB_USER: ${MARIADB_USER}
      WORDPRESS_DB_PASSWORD: ${MARIADB_PASSWORD}
      KAIROS_BASE_URL: ${KAIROS_BASE_URL}
      WORDPRESS_ADMIN_USER: ${WORDPRESS_ADMIN_USER}
      WORDPRESS_ADMIN_PASSWORD: ${WORDPRESS_ADMIN_PASSWORD}
      WORDPRESS_ADMIN_EMAIL: ${WORDPRESS_ADMIN_EMAIL:-vinicius@kairos.invalid}
    volumes:
      - kairos_wordpress_data:/var/www/html
      - ../../wordpress/bootstrap.sh:/bootstrap.sh:ro
      - ../../wordpress/content:/seed:ro
      - ../../wordpress/assets:/assets:ro
      - ../../wordpress/config:/config:ro
      - ../../wordpress/mu-plugins:/mu-plugins:ro
    entrypoint: ["/bin/sh", "/bootstrap.sh"]
    networks:
      - app
      - data
    depends_on:
      wordpress:
        condition: service_healthy
    mem_limit: 192m
    cpus: 0.35
    pids_limit: 96

  clamav:
    <<: *service-defaults
    image: clamav/clamav:1.5.3
    volumes:
      - kairos_clamav_data:/var/lib/clamav
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "clamdscan --ping 3 | grep -q PONG"]
      start_period: 120s
      interval: 30s
      timeout: 10s
      retries: 10
    mem_limit: 1g
    cpus: 0.75
    pids_limit: 256

networks:
  edge:
    name: kairos-edge
    labels:
      com.kairos.scope: edge
  app:
    name: kairos-app
    labels:
      com.kairos.scope: app
  data:
    name: kairos-data
    internal: true
    labels:
      com.kairos.scope: data
  ai:
    name: kairos-ai
    internal: true
    labels:
      com.kairos.scope: ai
  mcp:
    name: kairos-mcp
    internal: true
    labels:
      com.kairos.scope: mcp

volumes:
  kairos_localai_models:
    name: kairos_localai_models
    driver: local
    driver_opts: {type: none, o: bind, device: /srv/kairos/models}
  kairos_localai_backends:
    name: kairos_localai_backends
    driver: local
    driver_opts: {type: none, o: bind, device: /srv/kairos/localai-backends}
  kairos_localai_data:
    name: kairos_localai_data
    driver: local
    driver_opts: {type: none, o: bind, device: /srv/kairos/localai-data}
  kairos_hermes_data:
    name: kairos_hermes_data
    driver: local
    driver_opts: {type: none, o: bind, device: /srv/kairos/hermes}
  kairos_mcp_brasil_cache:
    name: kairos_mcp_brasil_cache
    driver: local
    driver_opts: {type: none, o: bind, device: /srv/kairos/mcp-brasil-cache}
  kairos_postgres_data:
    name: kairos_postgres_data
    driver: local
    driver_opts: {type: none, o: bind, device: /srv/kairos/postgres}
  kairos_redis_data:
    name: kairos_redis_data
    driver: local
    driver_opts: {type: none, o: bind, device: /srv/kairos/redis}
  kairos_minio_data:
    name: kairos_minio_data
    driver: local
    driver_opts: {type: none, o: bind, device: /srv/kairos/minio}
  kairos_mariadb_data:
    name: kairos_mariadb_data
    driver: local
    driver_opts: {type: none, o: bind, device: /srv/kairos/mariadb}
  kairos_wordpress_data:
    name: kairos_wordpress_data
    driver: local
    driver_opts: {type: none, o: bind, device: /srv/kairos/wordpress}
  kairos_clamav_data:
    name: kairos_clamav_data
    driver: local
    driver_opts: {type: none, o: bind, device: /srv/kairos/clamav}
  kairos_caddy_data:
    name: kairos_caddy_data
    driver: local
    driver_opts: {type: none, o: bind, device: /srv/kairos/caddy-data}
  kairos_caddy_config:
    name: kairos_caddy_config
    driver: local
    driver_opts: {type: none, o: bind, device: /srv/kairos/caddy-config}
