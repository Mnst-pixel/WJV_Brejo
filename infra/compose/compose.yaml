{
  "name": "kairos",
  "networks": {
    "ai": {
      "internal": true,
      "labels": {
        "com.kairos.scope": "ai"
      },
      "name": "kairos-ai"
    },
    "app": {
      "labels": {
        "com.kairos.scope": "app"
      },
      "name": "kairos-app"
    },
    "data": {
      "internal": true,
      "labels": {
        "com.kairos.scope": "data"
      },
      "name": "kairos-data"
    },
    "edge": {
      "labels": {
        "com.kairos.scope": "edge"
      },
      "name": "kairos-edge"
    },
    "mcp": {
      "internal": true,
      "labels": {
        "com.kairos.scope": "mcp"
      },
      "name": "kairos-mcp"
    },
    "parser": {
      "name": "kairos-parser",
      "internal": true,
      "labels": {
        "com.kairos.scope": "parser"
      }
    }
  },
  "services": {
    "api": {
      "command": [
        "api"
      ],
      "cpus": 1,
      "depends_on": {
        "postgres": {
          "condition": "service_healthy",
          "required": true
        },
        "redis": {
          "condition": "service_healthy",
          "required": true
        },
        "minio": {
          "condition": "service_healthy",
          "required": true
        }
      },
      "env_file": [
        {
          "path": "${KAIROS_SECRETS_DIR:?Use the protected release secrets}/api.env",
          "format": "raw",
          "required": true
        }
      ],
      "environment": {
        "CLAMAV_HOST": "clamav",
        "CLAMAV_PORT": "3310",
        "POSTGRES_HOST": "postgres",
        "POSTGRES_PORT": "5432",
        "REDIS_HOST": "redis",
        "REDIS_PORT": "6379",
        "S3_BUCKET_NAME": "documents",
        "S3_ENDPOINT_URL": "http://minio:9000",
        "KAIROS_BASE_URL": "https://kairos.2-24-215-183.sslip.io",
        "KAIROS_ALLOWED_HOSTS": "kairos.2-24-215-183.sslip.io,localhost,127.0.0.1,api",
        "KAIROS_CSRF_TRUSTED_ORIGINS": "https://kairos.2-24-215-183.sslip.io",
        "KAIROS_CORS_ORIGINS": "https://kairos.2-24-215-183.sslip.io",
        "KAIROS_TLS_ENABLED": "true",
        "LOCALAI_BASE_URL": "http://localai:8080",
        "KAIROS_TRUST_PROXY_HEADERS": "true",
        "KAIROS_LEGACY_DATA_DIR": "/app/legacy-extracted"
      },
      "healthcheck": {
        "interval": "15s",
        "retries": 8,
        "test": [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/live', timeout=3)"
        ],
        "timeout": "5s"
      },
      "init": true,
      "logging": {
        "driver": "json-file",
        "options": {
          "max-file": "3",
          "max-size": "10m"
        }
      },
      "mem_limit": "768m",
      "networks": {
        "app": null,
        "data": null,
        "ai": null
      },
      "pids_limit": 256,
      "restart": "unless-stopped",
      "security_opt": [
        "no-new-privileges:true"
      ],
      "image": "${KAIROS_IMAGE_API:?Use the versioned release descriptor}",
      "pull_policy": "never",
      "labels": {
        "com.kairos.managed": "release"
      },
      "read_only": true,
      "cap_drop": [
        "ALL"
      ],
      "tmpfs": [
        "/tmp:rw,nosuid,nodev,noexec,size=128m,uid=10001,gid=10001"
      ]
    },
    "clamav": {
      "cpus": 0.75,
      "healthcheck": {
        "interval": "30s",
        "retries": 10,
        "start_period": "120s",
        "test": [
          "CMD-SHELL",
          "clamdscan --ping 3 | grep -q PONG"
        ],
        "timeout": "10s"
      },
      "image": "${KAIROS_IMAGE_CLAMAV:?Use the versioned release descriptor}",
      "init": true,
      "logging": {
        "driver": "json-file",
        "options": {
          "max-file": "3",
          "max-size": "10m"
        }
      },
      "mem_limit": "1g",
      "networks": {
        "data": null
      },
      "pids_limit": 256,
      "restart": "unless-stopped",
      "security_opt": [
        "no-new-privileges:true"
      ],
      "volumes": [
        {
          "source": "kairos_clamav_data",
          "target": "/var/lib/clamav",
          "type": "volume",
          "volume": {}
        }
      ],
      "pull_policy": "never",
      "labels": {
        "com.kairos.managed": "release"
      },
      "environment": {}
    },
    "edge": {
      "cpus": 0.35,
      "depends_on": {
        "api": {
          "condition": "service_healthy",
          "required": true
        },
        "web": {
          "condition": "service_healthy",
          "required": true
        },
        "wordpress": {
          "condition": "service_healthy",
          "required": true
        }
      },
      "healthcheck": {
        "interval": "15s",
        "retries": 5,
        "test": [
          "CMD",
          "wget",
          "-q",
          "--spider",
          "http://127.0.0.1/healthz"
        ],
        "timeout": "5s"
      },
      "image": "${KAIROS_IMAGE_EDGE:?Use the versioned release descriptor}",
      "init": true,
      "logging": {
        "driver": "json-file",
        "options": {
          "max-file": "3",
          "max-size": "10m"
        }
      },
      "mem_limit": "192m",
      "networks": {
        "app": null,
        "edge": null
      },
      "pids_limit": 128,
      "ports": [
        {
          "mode": "ingress",
          "host_ip": "127.0.0.1",
          "target": 80,
          "published": "4080",
          "protocol": "tcp"
        }
      ],
      "restart": "unless-stopped",
      "security_opt": [
        "no-new-privileges:true"
      ],
      "volumes": [
        {
          "bind": {
            "create_host_path": false
          },
          "read_only": true,
          "source": "/opt/kairos/current/infra/caddy/Caddyfile",
          "target": "/etc/caddy/Caddyfile",
          "type": "bind"
        },
        {
          "source": "kairos_caddy_data",
          "target": "/data",
          "type": "volume",
          "volume": {}
        },
        {
          "source": "kairos_caddy_config",
          "target": "/config",
          "type": "volume",
          "volume": {}
        }
      ],
      "pull_policy": "never",
      "labels": {
        "com.kairos.managed": "release"
      },
      "environment": {},
      "read_only": true,
      "cap_drop": [
        "ALL"
      ],
      "cap_add": [
        "NET_BIND_SERVICE"
      ],
      "tmpfs": [
        "/tmp:rw,nosuid,nodev,size=32m"
      ],
      "env_file": [
        {
          "path": "${KAIROS_SECRETS_DIR:?}/edge.env",
          "required": true,
          "format": "raw"
        }
      ]
    },
    "localai": {
      "cpus": 3,
      "env_file": [
        {
          "path": "${KAIROS_SECRETS_DIR:?Use the protected release secrets}/localai.env",
          "format": "raw",
          "required": true
        }
      ],
      "environment": {
        "LOCALAI_BACKENDS_PATH": "/backends",
        "LOCALAI_DATA_PATH": "/data",
        "LOCALAI_DISABLE_WEBUI": "true",
        "LOCALAI_LOG_LEVEL": "info",
        "LOCALAI_MODELS_PATH": "/models",
        "LOCALAI_SUBTLE_KEY_COMPARISON": "true"
      },
      "healthcheck": {
        "interval": "30s",
        "retries": 20,
        "start_period": "10m",
        "test": [
          "CMD-SHELL",
          "curl -fsS -H \"Authorization: Bearer $$LOCALAI_API_KEY\" http://127.0.0.1:8080/readyz >/dev/null"
        ],
        "timeout": "15s"
      },
      "image": "${KAIROS_IMAGE_LOCALAI:?Use the versioned release descriptor}",
      "init": true,
      "logging": {
        "driver": "json-file",
        "options": {
          "max-file": "3",
          "max-size": "10m"
        }
      },
      "mem_limit": "3g",
      "networks": {
        "ai": null
      },
      "pids_limit": 512,
      "restart": "unless-stopped",
      "security_opt": [
        "no-new-privileges:true"
      ],
      "volumes": [
        {
          "source": "kairos_localai_models",
          "target": "/models",
          "type": "volume",
          "volume": {}
        },
        {
          "source": "kairos_localai_backends",
          "target": "/backends",
          "type": "volume",
          "volume": {}
        },
        {
          "source": "kairos_localai_data",
          "target": "/data",
          "type": "volume",
          "volume": {}
        },
        {
          "type": "volume",
          "source": "kairos_localai_configuration",
          "target": "/configuration"
        }
      ],
      "pull_policy": "never",
      "labels": {
        "com.kairos.managed": "release"
      }
    },
    "mariadb": {
      "cpus": 0.75,
      "environment": {},
      "healthcheck": {
        "interval": "10s",
        "retries": 15,
        "test": [
          "CMD-SHELL",
          "healthcheck.sh --connect --innodb_initialized"
        ],
        "timeout": "5s"
      },
      "image": "${KAIROS_IMAGE_MARIADB:?Use the versioned release descriptor}",
      "init": true,
      "logging": {
        "driver": "json-file",
        "options": {
          "max-file": "3",
          "max-size": "10m"
        }
      },
      "mem_limit": "640m",
      "networks": {
        "data": null
      },
      "pids_limit": 256,
      "restart": "unless-stopped",
      "security_opt": [
        "no-new-privileges:true"
      ],
      "volumes": [
        {
          "source": "kairos_mariadb_data",
          "target": "/var/lib/mysql",
          "type": "volume",
          "volume": {}
        }
      ],
      "pull_policy": "never",
      "labels": {
        "com.kairos.managed": "release"
      },
      "env_file": [
        {
          "path": "${KAIROS_SECRETS_DIR:?Use the protected release secrets}/mariadb.env",
          "format": "raw",
          "required": true
        }
      ]
    },
    "minio": {
      "command": [
        "server",
        "/data",
        "--console-address",
        ":9001"
      ],
      "cpus": 0.75,
      "environment": {
        "MINIO_BROWSER": "off"
      },
      "healthcheck": {
        "interval": "10s",
        "retries": 10,
        "test": [
          "CMD",
          "curl",
          "-fsS",
          "http://127.0.0.1:9000/minio/health/live"
        ],
        "timeout": "5s"
      },
      "init": true,
      "logging": {
        "driver": "json-file",
        "options": {
          "max-file": "3",
          "max-size": "10m"
        }
      },
      "mem_limit": "512m",
      "networks": {
        "data": null
      },
      "pids_limit": 256,
      "restart": "unless-stopped",
      "security_opt": [
        "no-new-privileges:true"
      ],
      "volumes": [
        {
          "source": "kairos_minio_data",
          "target": "/data",
          "type": "volume",
          "volume": {}
        }
      ],
      "image": "${KAIROS_IMAGE_MINIO:?Use the versioned release descriptor}",
      "pull_policy": "never",
      "labels": {
        "com.kairos.managed": "release"
      },
      "env_file": [
        {
          "path": "${KAIROS_SECRETS_DIR:?Use the protected release secrets}/minio.env",
          "format": "raw",
          "required": true
        }
      ],
      "read_only": true,
      "cap_drop": [
        "ALL"
      ],
      "tmpfs": [
        "/tmp:rw,nosuid,nodev,size=64m,uid=1000,gid=1000"
      ]
    },
    "postgres": {
      "cpus": 1,
      "environment": {
        "POSTGRES_INITDB_ARGS": "--auth-host=scram-sha-256"
      },
      "healthcheck": {
        "interval": "10s",
        "retries": 10,
        "test": [
          "CMD-SHELL",
          "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"
        ],
        "timeout": "5s"
      },
      "image": "${KAIROS_IMAGE_POSTGRES:?Use the versioned release descriptor}",
      "init": true,
      "logging": {
        "driver": "json-file",
        "options": {
          "max-file": "3",
          "max-size": "10m"
        }
      },
      "mem_limit": "1g",
      "networks": {
        "data": null
      },
      "pids_limit": 256,
      "restart": "unless-stopped",
      "security_opt": [
        "no-new-privileges:true"
      ],
      "volumes": [
        {
          "source": "kairos_postgres_data",
          "target": "/var/lib/postgresql/data",
          "type": "volume",
          "volume": {}
        }
      ],
      "pull_policy": "never",
      "labels": {
        "com.kairos.managed": "release"
      },
      "env_file": [
        {
          "path": "${KAIROS_SECRETS_DIR:?Use the protected release secrets}/postgres.env",
          "format": "raw",
          "required": true
        }
      ]
    },
    "redis": {
      "command": [
        "redis-server",
        "--appendonly",
        "yes",
        "--save",
        "60",
        "1000",
        "--aclfile",
        "/etc/kairos/users.acl",
        "--maxmemory",
        "192mb",
        "--maxmemory-policy",
        "noeviction"
      ],
      "cpus": 0.5,
      "environment": {},
      "healthcheck": {
        "interval": "10s",
        "retries": 10,
        "test": [
          "CMD-SHELL",
          "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"
        ],
        "timeout": "5s"
      },
      "image": "${KAIROS_IMAGE_REDIS:?Use the versioned release descriptor}",
      "init": true,
      "logging": {
        "driver": "json-file",
        "options": {
          "max-file": "3",
          "max-size": "10m"
        }
      },
      "mem_limit": "384m",
      "networks": {
        "data": null
      },
      "pids_limit": 128,
      "restart": "unless-stopped",
      "security_opt": [
        "no-new-privileges:true"
      ],
      "volumes": [
        {
          "source": "kairos_redis_data",
          "target": "/data",
          "type": "volume",
          "volume": {}
        },
        {
          "type": "bind",
          "source": "${KAIROS_SECRETS_DIR:?}/runtime/redis.acl",
          "target": "/etc/kairos/users.acl",
          "read_only": true,
          "bind": {
            "create_host_path": false
          }
        }
      ],
      "pull_policy": "never",
      "labels": {
        "com.kairos.managed": "release"
      },
      "env_file": [
        {
          "path": "${KAIROS_SECRETS_DIR:?Use the protected release secrets}/redis.env",
          "format": "raw",
          "required": true
        }
      ]
    },
    "web": {
      "cpus": 0.75,
      "environment": {
        "INTERNAL_API_URL": "http://api:8000",
        "NEXT_PUBLIC_BASE_PATH": "/app",
        "NEXT_TELEMETRY_DISABLED": "1",
        "NODE_ENV": "production"
      },
      "healthcheck": {
        "interval": "15s",
        "retries": 8,
        "test": [
          "CMD",
          "wget",
          "-q",
          "--spider",
          "http://127.0.0.1:3000/app/api/health"
        ],
        "timeout": "5s"
      },
      "init": true,
      "logging": {
        "driver": "json-file",
        "options": {
          "max-file": "3",
          "max-size": "10m"
        }
      },
      "mem_limit": "512m",
      "networks": {
        "app": null
      },
      "pids_limit": 256,
      "restart": "unless-stopped",
      "security_opt": [
        "no-new-privileges:true"
      ],
      "image": "${KAIROS_IMAGE_WEB:?Use the versioned release descriptor}",
      "pull_policy": "never",
      "labels": {
        "com.kairos.managed": "release"
      },
      "read_only": true,
      "cap_drop": [
        "ALL"
      ],
      "tmpfs": [
        "/tmp:rw,nosuid,nodev,size=64m,uid=10001,gid=10001"
      ]
    },
    "wordpress": {
      "cpus": 0.75,
      "depends_on": {
        "mariadb": {
          "condition": "service_healthy",
          "required": true
        }
      },
      "environment": {
        "WORDPRESS_CONFIG_EXTRA": "if (isset($$_SERVER['HTTP_X_FORWARDED_PROTO']) && strpos($$_SERVER['HTTP_X_FORWARDED_PROTO'], 'https') !== false) {\n  $$_SERVER['HTTPS'] = 'on';\n}\ndefine('DISALLOW_FILE_EDIT', true);\ndefine('WP_AUTO_UPDATE_CORE', false);\ndefine('FORCE_SSL_ADMIN', true);\n",
        "WORDPRESS_DB_HOST": "mariadb:3306"
      },
      "healthcheck": {
        "interval": "15s",
        "retries": 15,
        "test": [
          "CMD-SHELL",
          "php -r '$$c=@fsockopen(\"127.0.0.1\",80,$$e,$$s,2); exit($$c?0:1);'"
        ],
        "timeout": "5s"
      },
      "image": "${KAIROS_IMAGE_WORDPRESS:?Use the versioned release descriptor}",
      "init": true,
      "logging": {
        "driver": "json-file",
        "options": {
          "max-file": "3",
          "max-size": "10m"
        }
      },
      "mem_limit": "768m",
      "networks": {
        "app": null,
        "data": null
      },
      "pids_limit": 256,
      "restart": "unless-stopped",
      "security_opt": [
        "no-new-privileges:true"
      ],
      "volumes": [
        {
          "source": "kairos_wordpress_data",
          "target": "/var/www/html",
          "type": "volume",
          "volume": {}
        }
      ],
      "pull_policy": "never",
      "labels": {
        "com.kairos.managed": "release"
      },
      "env_file": [
        {
          "path": "${KAIROS_SECRETS_DIR:?Use the protected release secrets}/wordpress.env",
          "format": "raw",
          "required": true
        }
      ]
    },
    "worker": {
      "command": [
        "worker"
      ],
      "cpus": 1,
      "depends_on": {
        "clamav": {
          "condition": "service_healthy",
          "required": true
        },
        "postgres": {
          "condition": "service_healthy",
          "required": true
        },
        "redis": {
          "condition": "service_healthy",
          "required": true
        },
        "minio": {
          "condition": "service_healthy",
          "required": true
        }
      },
      "env_file": [
        {
          "path": "${KAIROS_SECRETS_DIR:?Use the protected release secrets}/worker.env",
          "format": "raw",
          "required": true
        }
      ],
      "environment": {
        "CLAMAV_HOST": "clamav",
        "CLAMAV_PORT": "3310",
        "POSTGRES_HOST": "postgres",
        "POSTGRES_PORT": "5432",
        "REDIS_HOST": "redis",
        "REDIS_PORT": "6379",
        "S3_BUCKET_NAME": "documents",
        "S3_ENDPOINT_URL": "http://minio:9000",
        "KAIROS_BASE_URL": "https://kairos.2-24-215-183.sslip.io",
        "KAIROS_ALLOWED_HOSTS": "kairos.2-24-215-183.sslip.io,localhost,127.0.0.1,api",
        "KAIROS_CSRF_TRUSTED_ORIGINS": "https://kairos.2-24-215-183.sslip.io",
        "KAIROS_CORS_ORIGINS": "https://kairos.2-24-215-183.sslip.io",
        "KAIROS_TLS_ENABLED": "true",
        "PARSER_BASE_URL": "http://parser:8090"
      },
      "init": true,
      "logging": {
        "driver": "json-file",
        "options": {
          "max-file": "3",
          "max-size": "10m"
        }
      },
      "mem_limit": "768m",
      "networks": {
        "app": null,
        "data": null,
        "parser": null
      },
      "pids_limit": 256,
      "restart": "unless-stopped",
      "security_opt": [
        "no-new-privileges:true"
      ],
      "image": "${KAIROS_IMAGE_API:?Use the versioned release descriptor}",
      "pull_policy": "never",
      "labels": {
        "com.kairos.managed": "release"
      },
      "read_only": true,
      "cap_drop": [
        "ALL"
      ],
      "tmpfs": [
        "/tmp:rw,nosuid,nodev,noexec,size=128m,uid=10001,gid=10001"
      ],
      "healthcheck": {
        "test": [
          "CMD",
          "celery",
          "-A",
          "kairos",
          "inspect",
          "ping",
          "--timeout=5"
        ],
        "interval": "60s",
        "timeout": "15s",
        "retries": 3
      }
    },
    "migrate": {
      "image": "${KAIROS_IMAGE_API:?Use the versioned release descriptor}",
      "pull_policy": "never",
      "profiles": [
        "maintenance"
      ],
      "command": [
        "migrate"
      ],
      "restart": "no",
      "user": "10001:10001",
      "read_only": true,
      "cap_drop": [
        "ALL"
      ],
      "security_opt": [
        "no-new-privileges:true"
      ],
      "env_file": [
        {
          "path": "${KAIROS_SECRETS_DIR:?Use protected release secrets}/migrate.env",
          "format": "raw",
          "required": true
        }
      ],
      "environment": {
        "POSTGRES_HOST": "postgres",
        "POSTGRES_PORT": "5432"
      },
      "networks": {
        "data": null
      },
      "tmpfs": [
        "/tmp:rw,nosuid,nodev,noexec,size=32m,uid=10001,gid=10001"
      ],
      "mem_limit": "512m",
      "cpus": 0.5,
      "pids_limit": 128
    },
    "parser": {
      "image": "${KAIROS_IMAGE_PARSER:?Use the versioned release descriptor}",
      "pull_policy": "never",
      "user": "10001:10001",
      "read_only": true,
      "cap_drop": [
        "ALL"
      ],
      "security_opt": [
        "no-new-privileges:true"
      ],
      "cpus": 0.5,
      "mem_limit": "640m",
      "pids_limit": 64,
      "restart": "unless-stopped",
      "init": false,
      "networks": {
        "parser": null
      },
      "tmpfs": [
        "/tmp:rw,nosuid,nodev,noexec,size=64m,uid=10001,gid=10001"
      ],
      "env_file": [
        {
          "path": "${KAIROS_SECRETS_DIR:?Use the protected release secrets}/parser.env",
          "format": "raw",
          "required": true
        }
      ],
      "logging": {
        "driver": "json-file",
        "options": {
          "max-file": "3",
          "max-size": "10m"
        }
      },
      "healthcheck": {
        "test": [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/healthz',timeout=3)"
        ],
        "interval": "30s",
        "timeout": "5s",
        "retries": 3
      },
      "labels": {
        "com.kairos.managed": "release"
      }
    },
    "beat": {
      "command": [
        "beat"
      ],
      "cpus": 0.2,
      "depends_on": {
        "redis": {
          "condition": "service_healthy"
        }
      },
      "env_file": [
        {
          "path": "${KAIROS_SECRETS_DIR:?Use the protected release secrets}/beat.env",
          "format": "raw",
          "required": true
        }
      ],
      "environment": {
        "REDIS_HOST": "redis",
        "REDIS_PORT": "6379"
      },
      "init": true,
      "logging": {
        "driver": "json-file",
        "options": {
          "max-file": "3",
          "max-size": "10m"
        }
      },
      "mem_limit": "192m",
      "networks": {
        "data": null
      },
      "pids_limit": 64,
      "restart": "unless-stopped",
      "security_opt": [
        "no-new-privileges:true"
      ],
      "image": "${KAIROS_IMAGE_BEAT:?Use the versioned release descriptor}",
      "pull_policy": "never",
      "labels": {
        "com.kairos.managed": "release"
      },
      "read_only": true,
      "cap_drop": [
        "ALL"
      ],
      "tmpfs": [
        "/tmp:rw,nosuid,nodev,noexec,size=128m,uid=10001,gid=10001"
      ],
      "healthcheck": {
        "test": [
          "CMD",
          "python",
          "-c",
          "from pathlib import Path; import time; assert any(time.time()-p.stat().st_mtime<600 for p in Path('/tmp').glob('kairos-celerybeat*'))"
        ],
        "interval": "60s",
        "timeout": "5s",
        "retries": 3,
        "start_period": "60s"
      }
    }
  },
